name: Update Event Coverage Issue

on:
  push:
    branches:
      - main

permissions:
  issues: write
  contents: read

jobs:
  update-issue:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Build and cache dependencies
        run: mvn install -DskipTests -Dspotless.check.skip=true -pl :rensai-agent-paper -am

      - name: Run event coverage test
        run: mvn test -Dtest=EventCoverageScannerTest -pl :rensai-agent-paper

      - name: Update GitHub Issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh issue edit 5 --body-file rensai-agents/rensai-agent-paper/event-coverage-report.md