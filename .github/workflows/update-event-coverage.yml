name: Update Event Coverage Issue

on:
  push:
    branches:
      - main

permissions:
  issues: write
  contents: read

jobs:
  update-issue:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - run: mvn test -Dtest=EventCoverageScannerTest -pl rensai-agent-paper

      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh issue edit 5 --body-file event-coverage-report.md