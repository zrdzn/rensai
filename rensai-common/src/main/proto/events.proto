syntax = "proto3";

package rensai.grpc;

import "google/protobuf/struct.proto";

option java_package = "dev.rensai.grpc";
option java_multiple_files = true;

service IngestionService {
  rpc SendGenericEvent (GenericEventRequest) returns (EventResponse);
  rpc ReportSupportedEvents (SupportedEventsRequest) returns (SupportedEventsResponse);
}

message GenericEventRequest {
  string event_name = 1;
  string game_source = 2;
  int64 timestamp = 3;
  google.protobuf.Struct properties = 4;
}

message EventResponse {
  bool success = 1;
}

message SupportedEventsRequest {
  string agent_id = 1;
  string agent_type = 2;
  repeated string event_names = 3;
}

message SupportedEventsResponse {
  bool success = 1;
}